[project]
name = "jupyterlab-diff-demo"
version = "0.1.0"
description = "JupyterLab Diff Demo"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jupyterlab>=4.6.0",
    "jupyterlab-diff",
    "jupyterlite-core>=0.8.0,<0.9",
    "jupyterlite-pyodide-kernel>=0.8.0,<0.9",
]

[tool.uv.sources]
jupyterlab-diff = { path = ".." }
